# Ficha de marco institucional. NO ES UNA NORMA: no obliga por si misma.
country: internacional
authority: FSB
instrument_type: hoja de ruta
instrument_number: "G20-CBP"
title: >-
  Hoja de ruta del G20 para la mejora de los pagos transfronterizos y sus
  objetivos cuantitativos
publication_date: "2020-10-13"
effective_date: no aplica: es un programa de trabajo, no una norma
implementation_stage: en ejecucion, con informes de avance periodicos
status: vigente
scope: >-
  Define los cuatro problemas estructurales de los pagos transfronterizos
  —coste, velocidad, acceso y transparencia— y fija objetivos cuantitativos
  para los segmentos mayorista, minorista y de remesas.
activities_covered:
  - pagos transfronterizos mayoristas
  - pagos transfronterizos minoristas
  - remesas
official_source: https://www.fsb.org/work-of-the-fsb/financial-innovation-and-structural-change/cross-border-payments/
last_verified: "2026-08-06"
supersedes: ninguno
superseded_by: ninguno
notes: >-
  Los valores y plazos de los objetivos son revisables y se han ajustado desde
  su publicacion: el material del programa los cita como marco y obliga a
  verificar la cifra vigente en la fuente antes de usarla en una decision. Ver
  Parte 18, clases 1, 10 y 13.
