# Ficha normativa. ESTA FICHA NO ES ASESORIA LEGAL.
country: Chile
authority: CMF
instrument_type: norma de caracter general
instrument_number: "502"
title: >-
  Norma de Caracter General que regula la inscripcion en el Registro de
  Prestadores de Servicios Financieros y la autorizacion de las entidades
  sujetas a la Ley 21.521
publication_date: "2024-01-12"
effective_date: >-
  con disposiciones transitorias: el plazo real depende de la actividad y de
  si la entidad ya operaba a la entrada en vigencia de la ley
implementation_stage: en aplicacion, con plazos transitorios por actividad
status: vigente
scope: >-
  Desarrolla el registro y la autorizacion de los prestadores de servicios
  financieros creados por la Ley 21.521: define la informacion que exige la
  solicitud, las exigencias de gobierno corporativo, gestion de riesgos,
  seguridad de la informacion y continuidad operacional, y los requisitos
  patrimoniales y de garantia segun la actividad y su escala.
activities_covered:
  - plataformas de financiamiento colectivo
  - sistemas alternativos de transaccion
  - intermediacion de instrumentos financieros
  - enrutamiento de ordenes
  - custodia de instrumentos financieros
  - asesoria crediticia
  - asesoria de inversion
official_source: https://www.cmfchile.cl/portal/principal/613/w3-channel.html
last_verified: "2026-08-12"
supersedes: ninguno
superseded_by: ninguno
notes: >-
  Es la pieza que convierte la Ley 21.521 en obligaciones exigibles: la ley
  enumera actividades, la norma dice que hay que presentar, con que
  patrimonio y en que plazo. El calendario transitorio es lo que mas cambia y
  lo que mas se cita mal. Antes de usar cualquier plazo, requisito
  patrimonial o formulario de esta ficha, verifica en el sitio de la CMF la
  version vigente de la norma y sus modificaciones posteriores, porque el
  detalle se ha ajustado por normas de caracter general sucesivas. Esta
  ficha no sustituye esa consulta ni constituye asesoria legal. Ver Parte 17,
  clase 3 y Parte 22, clases 4 y 21.
