# Ficha normativa. ESTA FICHA NO ES ASESORIA LEGAL.
country: union-europea
authority: Parlamento Europeo y Consejo de la Union Europea
instrument_type: reglamento
instrument_number: "2023/1114"
title: >-
  Reglamento (UE) 2023/1114 relativo a los mercados de criptoactivos
  y por el que se modifican otros reglamentos y directivas
publication_date: "2023-05-31"
effective_date: >-
  aplicacion escalonada desde 2024; los titulos sobre fichas referenciadas a
  activos y fichas de dinero electronico se aplicaron antes que el resto
implementation_stage: en aplicacion escalonada
status: vigente
scope: >-
  Establece el regimen de emision, oferta publica y admision a negociacion de
  criptoactivos, y el de autorizacion y supervision de los proveedores de
  servicios. Distingue tres categorias: fichas referenciadas a activos, fichas
  de dinero electronico y otros criptoactivos.
activities_covered:
  - emision de fichas referenciadas a activos
  - emision de fichas de dinero electronico
  - custodia y administracion por cuenta de terceros
  - explotacion de plataformas de negociacion
  - canje de criptoactivos por fondos
  - abuso de mercado en criptoactivos
official_source: https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX%3A32023R1114
last_verified: "2026-08-06"
supersedes: ninguno
superseded_by: ninguno
notes: >-
  Es una referencia comparada, no derecho aplicable en Chile. Se cita porque
  resuelve de forma expresa tres cuestiones que las Partes 20 y 22 analizan: el
  derecho de reembolso a la par, la prohibicion de remunerar el saldo de las
  fichas de dinero electronico y los requisitos de la reserva de activos. Las
  fechas de aplicacion escalonada y los actos delegados posteriores cambian el
  detalle: verificar siempre en EUR-Lex la version consolidada vigente. Ver
  Parte 20, clases 3, 4, 5 y 9, y Parte 22.
