# Ficha normativa. ESTA FICHA NO ES ASESORIA LEGAL.
country: union-europea
authority: Parlamento Europeo y Consejo de la Union Europea
instrument_type: reglamento
instrument_number: "2023/1113"
title: >-
  Reglamento (UE) 2023/1113 relativo a la informacion que acompana a las
  transferencias de fondos y de determinados criptoactivos
publication_date: "2023-06-09"
effective_date: "2024-12-30"
implementation_stage: en aplicacion
status: vigente
scope: >-
  Extiende a las transferencias de criptoactivos la obligacion de acompanar la
  operacion con los datos del ordenante y del beneficiario que ya regia para
  las transferencias de fondos. Es la version europea de la regla del viaje de
  la Recomendacion 16 del GAFI. Alcanza a los proveedores de servicios de
  criptoactivos y fija reglas para las transferencias desde o hacia
  direcciones autoalojadas.
activities_covered:
  - transferencias de fondos
  - transferencias de criptoactivos entre proveedores
  - transferencias desde o hacia direcciones autoalojadas
  - verificacion de la informacion del ordenante y del beneficiario
  - politicas ante informacion incompleta
official_source: https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX%3A32023R1113
last_verified: "2026-08-12"
supersedes: >-
  Reglamento (UE) 2015/847, al que refunde y sustituye
superseded_by: ninguno
notes: >-
  Es una referencia comparada, no derecho aplicable en Chile. Se cita porque
  demuestra la diferencia entre el estandar internacional y la norma que
  obliga: la Recomendacion 16 del GAFI es un estandar, este reglamento es
  derecho directamente aplicable con sancion. El tratamiento de las
  direcciones autoalojadas y los umbrales aplicables deben verificarse en la
  version consolidada y en las directrices de la Autoridad Bancaria Europea.
  Ver Parte 18, clase 12, Parte 20, clase 15 y Parte 22, clases 12 y 19.
