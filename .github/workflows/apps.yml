name: Aplicaciones

# Construye el material distribuible del programa y, cuando se etiqueta una
# version, publica el release con todo:
#
#   * el APK de Android, con todas las clases dentro y sin permiso de red;
#   * la aplicacion portable de Windows, con el mismo contenido;
#   * el manual completo en PDF;
#   * las sumas de verificacion de los tres.
#
# Las tres piezas parten del MISMO sitio generado por `tools/build_site.py`, de
# modo que la app, el escritorio y el portal no pueden divergir.
#
# Se puede lanzar a mano (`workflow_dispatch`) para comprobar que compila sin
# publicar nada.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contenido:
    name: Generar el contenido
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sin cache de pip: este flujo produce los binarios que se publican, y
      # una cache envenenada acabaria dentro del artefacto. Es el hallazgo
      # `cache-poisoning` de zizmor, y aqui aplica de verdad.
      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-site.txt -r requirements.txt cyclonedx-bom

      - name: Generar el sitio
        run: python tools/build_site.py --check

      - name: Generar el manual
        run: python tools/build_book.py

      - name: Comprobar que el contenido esta completo
        run: |
          esperadas=$(find modules -path '*/classes/*.md' | wc -l)
          clases=$(find site/modules -path '*/classes/*.html' | wc -l)
          echo "clases en el repositorio: $esperadas"
          echo "clases en el sitio:       $clases"
          if [ "$clases" -ne "$esperadas" ]; then
            echo "El sitio no trae las $esperadas clases: trae $clases"
            exit 1
          fi
          test -s book/programa-completo.pdf

      - name: Subir el sitio
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sitio
          path: site
          retention-days: 1

      - name: Subir el manual
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manual
          path: book/programa-completo.pdf
          retention-days: 1

      # Los paquetes del repositorio se construyen aqui y no en release.yml
      # para que un unico flujo publique todo: cuando publicaban los dos, cada
      # uno escribia su propio SHA256SUMS.txt y el segundo pisaba al primero,
      # de modo que el archivo publicado solo cubria la mitad de los adjuntos.
      # El paquete completo se arma desde `git ls-files` y no desde una lista
      # escrita a mano. La lista anterior nombraba seis directorios, y cada
      # vez que aparecia uno nuevo el paquete lo omitia en silencio: la 2.2.0
      # se publico sin los 26 estudios de caso ni las 13 fichas normativas, y
      # nada fallo porque un `zip` de una ruta inexistente no es un error.
      # Preguntandole a git, el paquete no puede quedarse corto.
      - name: Empaquetar el repositorio
        run: |
          mkdir -p dist
          git ls-files -z \
            ':!:.github' ':!:mobile' ':!:desktop' ':!:*.png' ':!:*.jpg' \
            > dist/incluidos.txt
          xargs -0 -a dist/incluidos.txt zip -q "dist/programa-completo.zip"
          zip -q -r "dist/solo-clases.zip" modules SYLLABUS.md \
            -x "*/__pycache__/*" "*.pyc"
          rm dist/incluidos.txt
          cyclonedx-py environment -o dist/sbom.json
          ls -lh dist

      # Un paquete que pesa lo esperado puede venir incompleto. Se abre y se
      # cuentan las piezas contra el repositorio, igual que con el APK.
      - name: Comprobar que el paquete trae todo
        run: |
          unzip -Z1 dist/programa-completo.zip > dist/dentro.txt
          for carpeta in modules docs apps case-studies regulatory datasets tools tests; do
            reales=$(git ls-files "$carpeta" | wc -l)
            dentro=$(grep -c "^${carpeta}/" dist/dentro.txt || true)
            printf '%-14s repositorio=%-5s paquete=%-5s\n' "$carpeta" "$reales" "$dentro"
            [ "$dentro" -eq "$reales" ] || { echo "El paquete no trae $carpeta completo"; exit 1; }
          done
          rm dist/dentro.txt

      - name: Subir los paquetes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paquetes
          path: dist/*
          retention-days: 1

  android:
    name: APK de Android
    needs: contenido
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Recuperar el sitio
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: sitio
          path: mobile/app/src/main/assets/site

      - name: Configurar Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      # Igual que con pip: sin cache de Gradle, por la misma razon.
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0
        with:
          cache-disabled: true

      # Se compila la variante de depuracion, no la de publicacion, porque
      # `assembleRelease` produce un APK SIN FIRMAR y Android se niega a
      # instalarlo: el artefacto compilaria y no serviria. La variante de
      # depuracion la firma Gradle con su clave de desarrollo, que es lo que
      # permite instalarlo de forma lateral. Firmarlo con una clave propia
      # exige un almacen de claves como secreto del repositorio; mientras no
      # exista, esta es la unica via que produce un APK instalable.
      - name: Compilar el APK
        working-directory: mobile
        env:
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleDebug

      # Un APK que compila puede instalarse vacio si el contenido no llego a
      # empaquetarse, o no instalarse siquiera si le falta la firma. Se abre y
      # se comprueban las dos cosas.
      - name: Comprobar que el APK trae las clases y esta firmado
        run: |
          esperadas=$(find modules -path '*/classes/*.md' | wc -l)
          apk=$(find mobile/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK: $apk ($(du -h "$apk" | cut -f1))"
          dentro=$(unzip -l "$apk" | grep -c 'assets/site/modules/.*/classes/.*\.html' || true)
          echo "clases esperadas:      $esperadas"
          echo "clases dentro del APK: $dentro"
          [ "$dentro" -eq "$esperadas" ] || { echo "El APK no trae las clases"; exit 1; }
          unzip -l "$apk" | grep -q 'assets/site/index.html' || { echo "Falta la portada"; exit 1; }
          firmante=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$firmante" verify --print-certs "$apk" | head -4
          echo "APK firmado"

      - name: Renombrar con la version
        env:
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
        run: |
          mkdir -p dist
          apk=$(find mobile/app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$apk" "dist/FinanzasYBanca-${VERSION_NAME}.apk"
          ls -lh dist

      - name: Subir el APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk
          path: dist/*.apk
          retention-days: 7

  windows:
    name: Aplicación de Windows
    needs: contenido
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Recuperar el sitio
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: sitio
          path: desktop/site

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt pyinstaller

      - name: Empaquetar
        env:
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
        run: >
          pyinstaller --noconfirm --windowed --name FinanzasYBanca
          --add-data "desktop/site;site"
          desktop/programa.py

      - name: Comprobar que la aplicación trae las clases
        shell: bash
        run: |
          esperadas=$(find modules -path '*/classes/*.md' | wc -l)
          raiz="dist/FinanzasYBanca/_internal/site"
          [ -d "$raiz" ] || raiz="dist/FinanzasYBanca/site"
          clases=$(find "$raiz/modules" -path '*/classes/*.html' | wc -l)
          echo "clases esperadas:    $esperadas"
          echo "clases empaquetadas: $clases"
          [ "$clases" -eq "$esperadas" ] || { echo "Faltan clases"; exit 1; }
          test -f "dist/FinanzasYBanca/FinanzasYBanca.exe"

      - name: Comprimir
        shell: pwsh
        env:
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
        run: |
          New-Item -ItemType Directory -Force salida | Out-Null
          Compress-Archive -Path dist/FinanzasYBanca/* `
            -DestinationPath "salida/FinanzasYBanca-windows-$env:VERSION_NAME.zip"
          Get-ChildItem salida | Format-List Name, Length

      - name: Subir el portable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: salida/*.zip
          retention-days: 7

  publicar:
    name: Publicar el release
    needs: [android, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Solo los artefactos que se publican. Sin `pattern`, tambien se
      # descargaria `sitio`, que es material intermedio de 16 MB en miles de
      # archivos: el release se llenaria de directorios y `sha256sum` fallaria
      # sobre ellos.
      - name: Recuperar los artefactos
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: entrega
          pattern: "{apk,windows,manual,paquetes}"
          merge-multiple: true

      - name: Sumas de verificación
        run: |
          cd entrega
          ls -lh
          # Solo archivos: si algo llega como directorio, es que se colo un
          # artefacto que no toca y es mejor detenerse.
          test -z "$(find . -mindepth 1 -maxdepth 1 -type d)" || {
            echo "Hay directorios en la entrega:"; find . -mindepth 1 -maxdepth 1 -type d; exit 1; }
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Se publica con `gh release`, que ya viene en el runner, en vez de con
      # una accion de terceros: una dependencia externa menos que fijar y
      # auditar para hacer exactamente lo mismo. Es la misma via que usa
      # release.yml.
      #
      # El release puede existir ya, creado por release.yml para la misma
      # etiqueta: en ese caso se le anaden los artefactos en vez de fallar.
      - name: Redactar las notas
        run: python tools/release_notes.py "${GITHUB_REF_NAME}" entrega > notas.md

      - name: Publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" entrega/* --repo "${REPO}" --clobber
            gh release edit "${GITHUB_REF_NAME}" --repo "${REPO}" --notes-file notas.md
          else
            gh release create "${GITHUB_REF_NAME}" entrega/*               --repo "${REPO}"               --title "${GITHUB_REF_NAME}"               --notes-file notas.md
          fi
