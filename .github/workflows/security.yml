name: Seguridad

# Un repositorio educativo publico tiene dos riesgos concretos:
#   1. que se filtre un secreto o un dato personal en el historial;
#   2. que una dependencia con vulnerabilidad conocida llegue a quien
#      clona el material para practicar.
#
# Este workflow vigila ambos. Se ejecuta en cada cambio y ademas cada lunes,
# porque una dependencia segura hoy puede dejar de serlo sin que nadie toque
# el repositorio.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencias:
    name: Auditoria de dependencias y de codigo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar herramientas de auditoria
        run: python -m pip install pip-audit bandit

      - name: Auditar dependencias declaradas
        run: pip-audit --requirement requirements.txt --requirement requirements-site.txt

      # -ll: solo hallazgos de severidad media o alta. Las herramientas son
      # didacticas y usan patrones (por ejemplo, entrada de linea de comandos)
      # que bandit marca en severidad baja por defecto.
      - name: Analisis estatico de seguridad
        run: bandit -r tools apps -ll

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Auditoria de seguridad"
            echo ""
            echo "- Dependencias auditadas con \`pip-audit\`"
            echo "- Codigo analizado con \`bandit\` (severidad media y alta)"
          } >> "$GITHUB_STEP_SUMMARY"

  secretos:
    name: Busqueda de secretos y datos personales
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Escaneo de secretos
        uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  resultado:
    name: Puerta de seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [dependencias, secretos]
    steps:
      # Igual que en ci.yml: los resultados entran por entorno, nunca
      # interpolados dentro del script.
      - name: Exigir que todos los jobs pasen
        env:
          DEPENDENCIAS: ${{ needs.dependencias.result }}
          SECRETOS: ${{ needs.secretos.result }}
        run: |
          estado=0
          for verificacion in \
            "Dependencias y codigo:${DEPENDENCIAS}" \
            "Secretos:${SECRETOS}"; do
            nombre="${verificacion%:*}"
            resultado="${verificacion##*:}"
            if [ "${resultado}" = "success" ]; then
              echo "OK    ${nombre}"
            else
              echo "FALLO ${nombre} (${resultado})"
              estado=1
            fi
          done
          exit "${estado}"
