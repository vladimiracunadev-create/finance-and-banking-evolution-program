name: Portal de estudio

# Publica el programa como sitio navegable en GitHub Pages: las 352 clases,
# la documentacion y los indices, con navegacion entre paginas y diagramas
# renderizados.
#
# El sitio ESPEJA la estructura del repositorio, de modo que cualquier enlace
# del material sigue funcionando dentro del portal.

on:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "docs/**"
      - "apps/**"
      - "localizations/**"
      - "*.md"
      - "LICENSE"
      - "VERSION"
      - "tools/build_site.py"
      - "tools/build_book.py"
      - "requirements-site.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Generar el portal
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # `pages: write` lo necesita configure-pages para activar Pages en un
    # repositorio (o en un fork) donde todavia no lo esta. Sin el permiso la
    # accion falla con "Resource not accessible by integration".
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt

      - name: Instalar dependencias del portal
        run: python -m pip install -r requirements-site.txt

      - name: Generar y verificar el portal
        run: python tools/build_site.py --check

      # El manual pesa demasiado para versionarlo en git y se regenera con cada
      # cambio de contenido, asi que se publica como descarga del portal. Va
      # despues de build_site.py porque ese script vacia `site/` antes de
      # generarlo. El runner de Ubuntu ya trae Google Chrome, que es lo que
      # build_book.py usa para imprimir el PDF.
      - name: Generar el manual completo
        run: python tools/build_book.py

      - name: Publicar el manual como descarga del portal
        run: |
          mkdir -p site/descargas
          cp book/programa-completo.pdf  site/descargas/
          cp book/programa-completo.html site/descargas/
          cp book/programa-completo.md   site/descargas/
          ls -lh site/descargas

      - name: Configurar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Portal de estudio"
            echo ""
            echo "- Paginas generadas: **$(find site -name '*.html' | wc -l)**"
            echo "- Peso del sitio: **$(du -sh site | cut -f1)**"
            echo "- Manual publicado: **$(du -h site/descargas/programa-completo.pdf | cut -f1)**"
          } >> "$GITHUB_STEP_SUMMARY"

  publicar:
    name: Publicar en GitHub Pages
    needs: construir
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      # La URL llega por variable de entorno y no interpolada dentro del script:
      # cualquier expresion ${{ }} escrita directamente en un `run` se expande
      # como texto antes de que el shell exista, y eso es una via de inyeccion.
      - name: Verificar que el portal responde
        env:
          URL_PORTAL: ${{ steps.despliegue.outputs.page_url }}
        run: |
          url="${URL_PORTAL}"
          echo "Comprobando $url"
          for intento in $(seq 1 12); do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" -L "$url" || echo "000")
            if [ "$codigo" = "200" ]; then
              echo "El portal responde 200"
              exit 0
            fi
            echo "Intento $intento: $codigo"
            sleep 10
          done
          echo "El portal no respondio 200 tras 12 intentos"
          exit 1

      # El README enlaza estas tres descargas desde su insignia y su barra de
      # navegacion. Si el despliegue las deja fuera, el enlace da 404 y nadie
      # se entera hasta que alguien lo pulsa: por eso se comprueban aqui.
      - name: Verificar que el manual se puede descargar
        env:
          URL_PORTAL: ${{ steps.despliegue.outputs.page_url }}
        run: |
          fallos=0
          for archivo in programa-completo.pdf programa-completo.html programa-completo.md; do
            url="${URL_PORTAL}descargas/${archivo}"
            codigo=$(curl -s -o /dev/null -w "%{http_code}" -L "$url" || echo "000")
            peso=$(curl -s -o /dev/null -w "%{size_download}" -L "$url" || echo "0")
            if [ "$codigo" = "200" ] && [ "$peso" -gt 100000 ]; then
              echo "OK    $archivo  ($peso bytes)"
            else
              echo "FALLA $archivo  (HTTP $codigo, $peso bytes)"
              fallos=$((fallos + 1))
            fi
          done
          [ "$fallos" -eq 0 ] || exit 1
