name: Publicacion

# Verificacion previa a una publicacion.
#
# Este flujo NO publica: lo hace `apps.yml`, que construye el APK, la
# aplicacion de Windows, el manual y los paquetes del repositorio, y adjunta
# todo al release con un unico archivo de sumas.
#
# Cuando publicaban los dos, cada uno escribia su propio SHA256SUMS.txt y el
# segundo en llegar pisaba al primero: el archivo publicado solo cubria la
# mitad de los adjuntos, y ademas el segundo fallaba con «a release with the
# same tag name already exists».
#
# Lo que queda aqui es la puerta: si el programa no valida, la etiqueta lo
# dice antes de que `apps.yml` empiece a compilar binarios.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar antes de publicar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Verificar el programa
        run: |
          python tools/validate_program.py
          python tools/render_program.py --check
          python tools/build_syllabus.py --check
          python tools/build_file_index.py --check
          python tools/progress.py --check
          python tools/check_links.py
          pytest -q

      - name: Comprobar que la version y la etiqueta coinciden
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="v$(cat VERSION)"
          echo "VERSION=${version} · etiqueta=${GITHUB_REF_NAME}"
          [ "${version}" = "${GITHUB_REF_NAME}" ] || {
            echo "La etiqueta no coincide con VERSION"; exit 1; }

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Verificacion previa"
            echo ""
            echo "Programa validado. La publicacion la realiza \`apps.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"
