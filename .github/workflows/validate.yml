name: Validate program

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Revisión semanal: detecta dependencias o enlaces que se rompen con el tiempo.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  estructura:
    name: Estructura, fuentes y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Validar estructura, secciones y fuentes
        run: python tools/validate_program.py

      - name: Verificar que todas las clases estén renderizadas
        run: python tools/render_program.py --check

      - name: Verificar que SYLLABUS.md refleje el índice real
        run: python tools/build_syllabus.py --check

      - name: Verificar que STATUS.md refleje el estado real
        run: python tools/progress.py --check

      - name: Ejecutar pruebas
        run: pytest -q

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Programa"
            echo ""
            python tools/validate_program.py
          } >> "$GITHUB_STEP_SUMMARY"

  enlaces:
    name: Enlaces internos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verificar enlaces relativos de todo el repositorio
        run: python tools/check_links.py

  markdown:
    name: Formato de Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Verificar que no queden marcadores de conflicto
        run: |
          if grep -rn --include="*.md" -E "^(<<<<<<<|>>>>>>>|=======)$" . ; then
            echo "Se encontraron marcadores de conflicto de fusion"
            exit 1
          fi
          echo "Sin marcadores de conflicto"

      - name: Verificar codificación y finales de línea
        run: |
          fallos=0
          while IFS= read -r archivo; do
            if file "$archivo" | grep -q "CRLF"; then
              echo "CRLF en $archivo"
              fallos=1
            fi
            if head -c 3 "$archivo" | grep -q $'\xef\xbb\xbf'; then
              echo "BOM en $archivo"
              fallos=1
            fi
          done < <(find . -name "*.md" -not -path "./.git/*")
          if [ "$fallos" -eq 1 ]; then exit 1; fi
          echo "Codificacion y finales de linea correctos"

  resumen:
    name: Resultado
    runs-on: ubuntu-latest
    needs: [estructura, enlaces, markdown]
    if: always()
    steps:
      - name: Verificar que todo pasó
        run: |
          if [ "${{ needs.estructura.result }}" != "success" ] || \
             [ "${{ needs.enlaces.result }}" != "success" ] || \
             [ "${{ needs.markdown.result }}" != "success" ]; then
            echo "Alguna verificacion fallo"
            exit 1
          fi
          echo "Todas las verificaciones pasaron"
