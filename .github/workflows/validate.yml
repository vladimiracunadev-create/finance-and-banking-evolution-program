name: Validate program
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "modules/**"
      - "apps/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/validate.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/validate_program.py
      - run: pytest -q
