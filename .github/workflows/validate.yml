name: Validate program

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Estructura, render y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Validar estructura, secciones y fuentes
        run: python tools/validate_program.py

      - name: Verificar que todo este renderizado
        run: python tools/render_program.py --check

      - name: Verificar que STATUS.md refleje la realidad
        run: python tools/progress.py --check

      - name: Ejecutar pruebas
        run: pytest -q

  links:
    name: Enlaces internos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar enlaces relativos de todo el repositorio
        run: python tools/check_links.py
